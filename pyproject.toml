[tool.poetry]
name = "garmin-sync-coros"
version = "0.1.0"
description = "Sync activities between Coros and Garmin Connect"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.28"
garth = "^0.4.38"
urllib3 = "^1.26"
certifi = "*"
# Needed only for Garmin -> Coros direction (OSS upload)
boto3 = "^1.36"
oss2 = "^2.19"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
